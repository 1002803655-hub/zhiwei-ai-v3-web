name: Lovis V3.1 checks
on:
  push:
    branches: [lovis-v31-dev]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile lovis_app.py lovis_bridge.py lovis_report.py dify_bridge.py app.py
      - name: Mocked API and privacy checks
        run: python -m unittest discover -s tests -p 'test_lovis_*.py' -v
