app:
  description: Lovis V4.0 L1 management agent. Consumes deterministic locator output and selects one expert route; it does not score faults.
  icon: 🤖
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: Lovis V4.0 AL-01 Management Agent (Experiment)
  use_icon_as_answer_icon: false
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    edges:
      - data: {sourceType: start, targetType: llm}
        id: start-to-manager
        source: start
        sourceHandle: source
        target: manager
        targetHandle: target
        type: custom
      - data: {sourceType: llm, targetType: answer}
        id: manager-to-answer
        source: manager
        sourceHandle: source
        target: answer
        targetHandle: target
        type: custom
    nodes:
      - id: start
        type: custom
        data: {type: start, title: Start, desc: '', variables: []}
        position: {x: 80, y: 282}
        positionAbsolute: {x: 80, y: 282}
        sourcePosition: right
        targetPosition: left
        width: 243
        height: 53
        selected: false
      - id: manager
        type: custom
        data:
          type: llm
          title: Management decision and summary
          desc: Uses the already-scored locator evidence. No independent scoring.
          context: {enabled: false, variable_selector: []}
          memory: {query_prompt_template: '', role_prefix: {assistant: '', user: ''}, window: {enabled: false, size: 10}}
          model:
            provider: openai
            name: gpt-4o-mini
            mode: chat
            completion_params: {temperature: 0.1, top_p: 1, max_tokens: 1200}
          prompt_template:
            - role: system
              text: |-
                You are Lovis V4.0 L1 production-line management, prompt contract v1.2. Input evidence comes from the deterministic Python locator; station_candidates are already ranked. Never calculate, change, reorder, or reinterpret ranking_score. Scores are experimental rule points, never probabilities. A candidate is an investigation lead, not a confirmed fault. Preserve supporting evidence, contradicting evidence, missing_data, warnings, diagnosis_status, and verified_fault=false.

                For stage=dispatch, select one expert route or human_review/none, using the original locator evidence. Return only JSON: {"next_expert":"...","reason":"...","candidate_station_id":"...","verified_fault":false}. Route S02 gripper evidence to robot_expert; S02 servo/motion evidence to motion_control_expert; S03 press evidence to press_expert; S04 vision evidence to vision_expert. If evidence is insufficient or only shared PLC evidence exists, select human_review.

                For stage=followup, use locator, first_expert_result, experts_called, evidence_gaps, allowed_experts and expert_calls_remaining. Select finish unless original locator event IDs in allowed_experts provide relevant evidence for a different expert. An expert recommendation to inspect another device is not evidence. Never repeat experts_called; never request more than two experts total. Cite only event IDs listed under the selected expert in allowed_experts. If no sufficient evidence remains, choose human_review or finish. Return JSON only with exactly these fields: next_action, next_expert, reason, supporting_event_ids, verified_fault. next_action is finish, call_expert, or human_review. For call_expert set next_expert to one allowed expert and cite its event IDs; for other actions next_expert must be null and the evidence list empty. verified_fault is always false.

                For stage=summarize, give a concise final summary entirely in Simplified Chinese. State the candidate ranking as experimental rule points, preserve evidence gaps and contradictions, distinguish partial completion or human review, and never say a fault is confirmed. Return only JSON: {"summary":"...","verified_fault":false}.
            - role: user
              text: '{{#sys.query#}}'
          vision: {enabled: false}
          variables: []
        position: {x: 380, y: 282}
        positionAbsolute: {x: 380, y: 282}
        sourcePosition: right
        targetPosition: left
        width: 300
        height: 120
        selected: false
      - id: answer
        type: custom
        data: {type: answer, title: Structured agent response, desc: '', answer: '{{#manager.text#}}', variables: []}
        position: {x: 760, y: 282}
        positionAbsolute: {x: 760, y: 282}
        sourcePosition: right
        targetPosition: left
        width: 243
        height: 80
        selected: false
  rag_pipeline_variables: []
version: '0.3.0'
kind: app

